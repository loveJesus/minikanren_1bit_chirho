[package]
name = "minikanren_1bit_chirho"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
description = "miniKanren as 1-bit matrix operations - hardware-accelerated logic programming with SIMD, GPU, and FPGA support. Includes Sudoku solver (14μs), N-Queens, constraint propagation."
license = "MIT"
repository = "https://github.com/loveJesus/minikanren_1bit_chirho"
documentation = "https://docs.rs/minikanren_1bit_chirho"
readme = "README.md"
keywords = ["logic-programming", "minikanren", "constraint-solving", "fpga", "simd"]
categories = ["algorithms", "science", "mathematics"]
authors = ["loveJesus"]
exclude = [
    "benches/*",
    "tests/*",
    ".github/*",
]

[dependencies]
# E-graphs for equality saturation (optional, use egraph_native_chirho instead)
egg = { version = "0.9", optional = true }
# GPU compute via WebGPU (optional)
wgpu = { version = "0.19", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }

# Symbolic computation (optional, for expression simplification)
# symbolic_expressions = "5"

# WebAssembly bindings (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

# Parallel processing (optional)
rayon = { version = "1.10", optional = true }

# Logging (optional, for FPGA backend diagnostics)
log = { version = "0.4", optional = true }

# Memory-mapped I/O for FPGA PCIe (Linux only, optional)
[target.'cfg(target_os = "linux")'.dependencies]
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
# For benchmarking on stable
criterion = "0.5"
# Property-based testing (Kmett would approve)
proptest = "1.4"

[[bench]]
name = "criterion_bench_chirho"
harness = false

[[bench]]
name = "packed_bench_chirho"
harness = false

[[bench]]
name = "goal_bench_chirho"
harness = false
# AST comparison available with: --features goal_ast_chirho

[[bench]]
name = "optics_bench_chirho"
harness = false

[[bench]]
name = "approaches_bench_chirho"
harness = false

[[bench]]
name = "synthesis_bench_chirho"
harness = false

[[bench]]
name = "comparison_bench_chirho"
harness = false

[[bench]]
name = "differentiable_bench_chirho"
harness = false

[[bench]]
name = "gpu_bench_chirho"
harness = false

[[bench]]
name = "sygus_bench_chirho"
harness = false

[[bench]]
name = "domain_composition_bench_chirho"
harness = false

[[bench]]
name = "contraction_bench_chirho"
harness = false

[[bench]]
name = "family_bench_chirho"
harness = false

[[bench]]
name = "parallel_bench_chirho"
harness = false
required-features = ["parallel_chirho"]

[[bench]]
name = "datalog_bench_chirho"
harness = false

[[bench]]
name = "symbolic_addition_bench_chirho"
harness = false

[[bench]]
name = "contraction_heuristics_bench_chirho"
harness = false

[features]
default = ["egraph_native_chirho"]
# Use reference (stream-based) implementation instead of hardware (bit-parallel)
# Enable for: compatibility testing, benchmarking against traditional miniKanren
reference_chirho = []
# Use external egg crate (general purpose, more features)
egg_chirho = ["egg"]
# Use native e-graph (hardware-optimized, bit-parallel, full _chirho compliance)
egraph_native_chirho = []
# Goal-as-AST for introspection/optimization (15-70% slower execution)
# Enable for: goal analysis, optimization passes, serialization
# Disable for: FPGA/hardware targets where raw speed matters
goal_ast_chirho = []
# Enable GPU backend (requires wgpu)
gpu_chirho = ["wgpu", "pollster", "bytemuck"]
# Enable multi-core parallel processing (requires rayon)
parallel_chirho = ["rayon"]

# Enable Verilator co-simulation for hardware verification (P5-00)
# Requires: verilator installed, searchEngineChirho.v compiled
verilator_chirho = []

# Enable FPGA backend (AWS F2 via PCIe)
# Requires: Running on F2 instance with AFI loaded
# Only links memmap2 on Linux (where FPGA hardware exists)
fpga_chirho = ["log", "memmap2"]

# ============================================================================
# Category-theoretic extensions (Kmett-inspired)
# ============================================================================

# Optics: Prisms, Traversals, Lenses for term manipulation
# Enables: unified walk/reify, pattern matching
# Overhead: ~5% (extra trait dispatch)
optics_chirho = []

# Free Monad Goals: Same AST, multiple interpreters (Bool, Prob, SMT)
# Enables: differentiable logic, SMT export, probabilistic semantics
# Overhead: ~10% (Box<dyn> indirection)
free_goal_chirho = []

# Comonadic Streams: Search zipper, extend, constraint propagation
# Enables: focused search, local context, neighborhood operations
# Overhead: ~8% (zipper overhead)
comonad_chirho = []

# Linear Logic: Tensor/Par connectives, session types
# Enables: resource-aware logic, protocol verification
# Overhead: minimal (Rust ownership already linear)
linear_chirho = []

# All category-theoretic extensions
kmett_chirho = ["optics_chirho", "free_goal_chirho", "comonad_chirho", "linear_chirho"]

# WebAssembly support (enables JavaScript bindings)
wasm_chirho = ["wasm-bindgen", "js-sys", "getrandom"]

[lib]
crate-type = ["cdylib", "rlib"]
